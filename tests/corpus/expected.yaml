# Approved facts for the real local score corpus (opt-in, never run in CI).
#
# Facts are hand-written statements checked by the user against the PDFs.
# They hold no music content: instrument names, page, bar and marker only.
# Add an entry only after the user has approved it. Pages and bars match
# exactly. See README.md, "Corpus tests", for every key.
#
# scores:
#   <pdf file name without .pdf>:
#     instruments: [Alto Sax, {name: Wood Block, xfail: "why the tool misses it"}]
#     max_features: 13
#     features:
#       - {instrument: Alto Sax, page: 5, bar: 29}
#       - {instruments: [Clarinet, Trumpet], kind: shared, page: 1, bar: 9, mark: A}
#       - {instrument: Vocal, kind: vocal, voice: female, page: 3, mark: B}
#       - {open: true, page: 2, bar: 45}
#     not_features:
#       - {instrument: Baritone Sax, page: 5}
#
# `open: true` stands for a feature with no instrument (a generic marking over the staves, an open
# solo); combine it with page, bar and mark. It replaces `instrument`.
#
# `xfail: reason` marks a fact the tool does not meet yet. It must keep
# failing; once it passes, the suite says to remove the xfail.
scores:
  "JINGLE BELLS AJC 2026 - Score":
    instruments:
      - Piccolo
      - Alto Sax
      - Tenor Sax
      - Baritone Sax
      - Trumpet
      - Trombone
      - Violin
      - Viola
      - Piano
      - Guitar
      - Electric Bass
      - Drums
      - Wood Block
    # Thirteen verified features; the Bass Guitar "Solo" on p1 mm1-5 is ambiguous, so one extra is allowed
    # (14); the reported list matches that (the three false positives are gone).
    max_features: 14
    features:
      - {instrument: Alto Sax, page: 5, bar: 29}
      - {instrument: Trombone, page: 8, bar: 44, xfail: "reported at bar 45: the cue copies are in bar 45; the own-staff SOLO in bar 44 is only a location (see ADR 0002)"}
      - {instrument: Baritone Sax, page: 9, bar: 49}
      - {instrument: Trombone, page: 9, bar: 52, xfail: "reported at bar 53: the TBN SOLO text sits one bar after the printed 52 (see ADR 0002)"}
      - {instrument: Baritone Sax, page: 10, bar: 57}
      - {instrument: Piano, page: 11, bar: 61}
      - {instrument: Trumpet, page: 13, bar: 77}
      - {instrument: Tenor Sax, page: 16, bar: 94}
      - {instrument: Violin, page: 19, bar: 110}
      - {instrument: Guitar, page: 23, bar: 135}
      - {instrument: Guitar, page: 24, bar: 143}
      - {instrument: Guitar, page: 26, bar: 151}
      - {instrument: Guitar, page: 28, bar: 164}
      - {instrument: Guitar, chair: 1, page: 23, bar: 135}
      - {instrument: Guitar, chair: 2, page: 24, bar: 143}
      - {instrument: Guitar, chair: 1, page: 26, bar: 151}
      - {instrument: Guitar, chair: 2, page: 28, bar: 164}
    not_features:
      - {instrument: Baritone Sax, page: 5}
      - {instrument: Trombone, page: 13}
      - {instrument: Baritone Sax, page: 16}

  "Winter Wonderland JC2026 SCORE NOT FINAL":
    instruments: [Soprano Sax, Clarinet, Trumpet]
    # One shared feature and seven vocal leads; no other instrument solos.
    max_features: 8
    features:
      - {instruments: [Clarinet, Soprano Sax, Trumpet], kind: shared, page: 1, bar: 9, mark: A, xfail: "marker A m9 is read (p1, bar 9, mark A) on the Clarinet feature; Soprano Sax and Trumpet 3 carry no marking text at that place, so they are not reported with it"}
      # Vocal leads are features of kind "vocal lead" with a voice, not instruments.
      - {instrument: Vocal, kind: vocal, voice: female, page: 3, mark: B}
      - {instrument: Vocal, kind: vocal, voice: male, page: 3, mark: C, xfail: "the male lead is reported on p4, not p3 at C"}
      - {instrument: Vocal, kind: vocal, voice: female, mark: D}
      - {instrument: Vocal, kind: vocal, voice: male, page: 10, mark: H, xfail: "the male lead at H is not found; only the female lead at H + 4 is"}
      - {instrument: Vocal, kind: vocal, voice: female, page: 10, mark: H}
      - {instrument: Vocal, kind: vocal, voice: male, page: 15}
      - {instrument: Vocal, kind: vocal, voice: female, page: 16}

  "ERGUE A CASA 10.22.26 - Piano":
    instruments: [Trumpet, Alto Sax, Trombone, Organ, Guitar, Electric Bass, Drums]
    max_features: 1
    features:
      - {instrument: Guitar, page: 16, bar: 62}
      - {instrument: Guitar, chair: 1, page: 16, bar: 62}

  # The file name ends in a space before ".pdf"; the key keeps it.
  "HOLIDAY IN 11_3_26 - Score ":
    # The violin is a separate part file, so the score shows only the piano staff.
    instruments: [Piano]
    # One feature: a violin solo in bars 56-64 (bar 48 starts an 8-measure rest, not the solo).
    max_features: 1
    features:
      - {instrument: Violin, page: 5, bar: 56, xfail: "the violin is now reported on p5 as a possible feature, but at bar 48: barlines cannot be counted there (bar kind nearest), so the nearest printed number is the bar that starts the 8-measure rest; order and section are right"}

  "I HEARD THE BELLS ON CHRISTMAS DAY- SCORE.":
    # Seven features: six vocal cues over the SATB staves (a choir label stays out of the
    # instrument table) and one clarinet solo. Pages only, apart from the first start bar.
    max_features: 7
    features:
      # One vocal solo (first time), all in unison on the repeat; it starts before the repeat and carries to p2.
      - {instrument: Vocal, kind: vocal, page: 1, bar: 4}
      # A tenor/bass-line vocal solo.
      - {instrument: Vocal, kind: vocal, page: 5}
      # "Solo or All": left to the conductor or vocalist.
      - {instrument: Vocal, kind: vocal, page: 6}
      - {instrument: Vocal, kind: vocal, page: 10}
      - {instrument: Vocal, kind: vocal, page: 12}
      # The p13 marking is on the TB line of the SATB staves, not the piano.
      - {instrument: Vocal, kind: vocal, page: 13}
      - {instrument: Clarinet, page: 16}
    not_features:
      - {instrument: Piano, page: 13}

  "I Pray on Christmas extended version nov Score":
    # Three features: a piano solo vamp, a tuba solo while the bass is tacet, and a tuba solo break.
    max_features: 3
    features:
      - {instrument: Piano, page: 1}
      - {instrument: Tuba, page: 3}
      - {instrument: Tuba, page: 8, bar: 46, mark: D, xfail: "reported once, as an open solo with no instrument: the marking is generic over every staff, so it is not given to a staff"}
    not_features:
      - {instrument: Alto Sax, page: 8}

  # A scan (OCR). Page-1 staves: Alto Sax 1-2, Tenor Sax 1-2, Baritone Sax, Trumpet 1-4,
  # Trombone 1-4, Guitar, Piano, Bass, Drums, Vibraphone. Staff names are not abbreviated on later pages.
  # The checker cannot test chair numbers on instruments; the tool misses Trumpet 1 and 4 and adds a bogus Trombone 29.
  "SCORE- The Most Wonderful Time of the Year  copy":
    instruments:
      - Alto Sax
      - Tenor Sax
      - Baritone Sax
      - Trumpet
      - Trombone
      - Guitar
      - Piano
      - Bass
      - Drums
      - Vibraphone
    # No solo or feature markings in this score.
    max_features: 0

  # Page-1 staves: Vocals (two staves, Alto and Alto: vocal parts, not the sax), Flute, Trumpet in Bb,
  # Trombone, Guitar, Organ (unlabeled on later pages), Piano, Acoustic Bass ("A.B."), Drum Set.
  # The two "Alto" staves under the "Vocals" group are voice staves: the tool reports no Alto Sax or Lead Vocal
  # (the checker cannot assert an instrument is absent; the in-place run shows it).
  "What Child is This 2018 - SCORE":
    instruments:
      - Flute
      - Trumpet
      - Trombone
      - Guitar
      - Organ
      - Piano
      - Bass
      - Drums
    # One feature: a group of solos over bars 45-77 inside a repeat (the "(SOLOS)" marking is printed
    # over every staff but the organ and drums; bar 77 is marked "lead only"). Who plays is not clear, so
    # it is one open solo with no instrument. The tool reports it once (p2, bar 45) plus one false positive,
    # a guitar solo built from chord text (p4, bar 93), so the cap is 2; lower it to 1 when that goes.
    max_features: 2
    features:
      - {open: true, page: 2, bar: 45}
