# Approved facts for the real local score corpus (opt-in, never run in CI).
#
# Facts are hand-written statements checked by the user against the PDFs.
# They hold no music content: instrument names, page, bar and marker only.
# Add an entry only after the user has approved it. Pages and bars match
# exactly. See README.md, "Corpus tests", for every key.
#
# scores:
#   <pdf file name without .pdf>:
#     instruments: [Alto Sax, {name: Wood Block, xfail: "why the tool misses it"}]
#     max_features: 13
#     features:
#       - {instrument: Alto Sax, page: 5, bar: 29}
#       - {instruments: [Clarinet, Trumpet], kind: shared, page: 1, bar: 9, mark: A}
#       - {instrument: Vocal, kind: vocal, voice: female, page: 3, mark: B}
#       - {open: true, page: 2, bar: 45}
#       - {instrument: Trombone, section: B}
#     order:
#       - {instrument: Piano, page: 1}
#       - {instrument: Tuba, page: 8}
#     not_features:
#       - {instrument: Baritone Sax, page: 5}
#
# `open: true` stands for a feature with no instrument (a generic marking over the staves, an open
# solo); combine it with page, bar and mark. It replaces `instrument`.
#
# `section` is another name for `mark` (give both only with the same value): the rehearsal mark the flow draft groups by (marks carry
# across page turns, ADR 0003). `order` lists single-instrument feature entries that must appear in
# this order in the report (score order: page, bar, x), not necessarily adjacent, so a fact can say
# "Tuba p8 follows Piano p1" without exact bars. An entry names one instrument (a shared feature matches
# by any of its instruments) and takes no `instruments`, `open`, `kind: shared` or `xfail`.
#
# `parts:` lists the part files of the song (the one-instrument PDFs in the `parts/<instrument folder>/` tree,
# found in SCORE_PARTS_DIR by the song title of their file names; opt-in like SCORE_CORPUS_DIR) with who plays
# them and their solos; no file names, only names, pages and marks. A part names `slot` (the instrument folder
# it sits in: who plays it) and `instrument` (the filename's part word), and may give `chairs` (the exact list),
# `relation` (same, doubling, unexplained, unknown), `max_solos` and `solos`. `max_solos` counts every feature of
# the part, vocal leads and other kinds included, and a solo fact matches a feature of any kind. A solo gives `page`, and `mark`
# and `bar` when known (exact, like features); the listed solos must appear in that order in the part, not
# necessarily adjacent, so a section and its order count before exact bars. A part and a solo take `xfail`;
# a solo with an xfail leaves the order check.
#
#     parts:
#       - {slot: flute, instrument: Piccolo, relation: doubling, solos: [{page: 2, mark: C, bar: 17}, {page: 5, mark: E}]}
#       - {slot: trumpet-3, instrument: Trumpet, chairs: [3], max_solos: 0}
#       - {slot: bass, instrument: Electric Bass, xfail: "why the part is not met yet"}
#
# `xfail: reason` marks a fact the tool does not meet yet. It must keep
# failing; once it passes, the suite says to remove the xfail.
scores:
  "JINGLE BELLS AJC 2026 - Score":
    instruments:
      - Piccolo
      - Alto Sax
      - Tenor Sax
      - Baritone Sax
      - Trumpet
      - Trombone
      - Violin
      - Viola
      - Piano
      - Guitar
      - Electric Bass
      - Drums
      - Wood Block
    # Thirteen verified features; the Bass Guitar "Solo" on p1 mm1-5 is ambiguous, so one extra is allowed
    # (14); the reported list matches that (the three false positives are gone).
    max_features: 14
    features:
      - {instrument: Alto Sax, page: 5, bar: 29}
      - {instrument: Trombone, page: 8, bar: 44, xfail: "reported at bar 45: the cue copies are in bar 45; the own-staff SOLO in bar 44 is only a location (see ADR 0002)"}
      - {instrument: Baritone Sax, page: 9, bar: 49}
      - {instrument: Trombone, page: 9, bar: 52, xfail: "reported at bar 53: the TBN SOLO text sits one bar after the printed 52 (see ADR 0002)"}
      - {instrument: Baritone Sax, page: 10, bar: 57}
      - {instrument: Piano, page: 11, bar: 61}
      - {instrument: Trumpet, page: 13, bar: 77}
      - {instrument: Tenor Sax, page: 16, bar: 94}
      - {instrument: Violin, page: 19, bar: 110}
      - {instrument: Guitar, page: 23, bar: 135}
      - {instrument: Guitar, page: 24, bar: 143}
      - {instrument: Guitar, page: 26, bar: 151}
      - {instrument: Guitar, page: 28, bar: 164}
      - {instrument: Guitar, chair: 1, page: 23, bar: 135}
      - {instrument: Guitar, chair: 2, page: 24, bar: 143}
      - {instrument: Guitar, chair: 1, page: 26, bar: 151}
      - {instrument: Guitar, chair: 2, page: 28, bar: 164}
    not_features:
      - {instrument: Baritone Sax, page: 5}
      - {instrument: Trombone, page: 13}
      - {instrument: Baritone Sax, page: 16}

  "Winter Wonderland JC2026 SCORE NOT FINAL":
    instruments: [Soprano Sax, Clarinet, Trumpet]
    # Ten features: one shared marking at A, clarinet solos at F and M and seven vocal leads (a lead that
    # runs over a page turn is one feature, so no second female feature on p7; a female harmony over
    # the male lead on p5 is not a lead of its own). The tool reports eight: the clarinet at F is missed.
    max_features: 10
    features:
      - {instruments: [Clarinet, Soprano Sax, Trumpet], kind: shared, page: 1, bar: 9, mark: A, xfail: "marker A m9 is read (p1, bar 9, mark A) on the Clarinet feature; Soprano Sax and Trumpet 3 carry no marking text at that place, so they are not reported with it"}
      # Vocal leads are features of kind "vocal lead" with a voice, not instruments.
      - {instrument: Vocal, kind: vocal, voice: female, page: 3, mark: B}
      - {instrument: Vocal, kind: vocal, voice: male, page: 3, mark: C, xfail: "the male lead is reported on p4, not p3 at C"}
      # Female from 4 bars after D, running through E (p6-7).
      - {instrument: Vocal, kind: vocal, voice: female, page: 6, mark: D}
      # The solo at F is not marked: the clarinet is the only brass or woodwind playing from F to almost G, where Soprano Sax and Trumpet 3 join. The only text is the word CLARINET above the sax group.
      - {instrument: Clarinet, page: 8, mark: F, xfail: "no solo marking: the solo is implied by the clarinet playing alone from F to almost G (the other winds rest in their parts)"}
      # At H the male takes over from the female and the backing vocals, then the female returns 4 bars later.
      - {instrument: Vocal, kind: vocal, voice: male, page: 10, mark: H}
      - {instrument: Vocal, kind: vocal, voice: female, page: 10, mark: H}
      - {instrument: Vocal, kind: vocal, voice: male, page: 15, mark: M}
      # The Clarinet part marks a solo at M (found by reading the part, not the score).
      - {instrument: Clarinet, mark: M, xfail: "the conductor score shows no clarinet solo at M; only the Clarinet part marks it"}
      - {instrument: Vocal, kind: vocal, voice: female, page: 16}
    # Order the tool gets right (the clarinet at F is not reported, so not listed).
    order:
      - {instrument: Clarinet, page: 1, mark: A}
      - {instrument: Vocal, voice: female, page: 3, mark: B}
      - {instrument: Vocal, voice: male, mark: C}
      - {instrument: Vocal, voice: female, mark: D}
      - {instrument: Vocal, voice: male, page: 10, mark: H}
      - {instrument: Vocal, voice: female, page: 10, mark: H}
      - {instrument: Vocal, voice: male, page: 15, mark: M}
      - {instrument: Vocal, voice: female, page: 16}
    # The female run from D through E (p6-7) is one feature: no second one on p7.
    not_features:
      - {instrument: Vocal, kind: vocal, voice: female, page: 7}

  "ERGUE A CASA 10.22.26 - Piano":
    instruments: [Trumpet, Alto Sax, Trombone, Organ, Guitar, Electric Bass, Drums]
    max_features: 1
    features:
      - {instrument: Guitar, page: 16, bar: 62}
      - {instrument: Guitar, chair: 1, page: 16, bar: 62}

  # The file name ends in a space before ".pdf"; the key keeps it.
  "HOLIDAY IN 11_3_26 - Score ":
    # The violin is a separate part file, so the score shows only the piano staff.
    instruments: [Piano]
    # One feature: a violin solo (p5, bar 56).
    max_features: 1
    features:
      - {instrument: Violin, page: 5, bar: 56, xfail: "reported on p5 as a possible feature but at bar 48, where an 8-measure rest starts; the solo starts at bar 56. In the violin part the bar labels 33, 40 and 48 each start a rest of 7, 8 and 8 bars, and the 56 label is jammed into the 33 label at the staff start; the solo is improvised (chords above the staves, hash marks inside them, no solo wording); order and section are right"}

  "I HEARD THE BELLS ON CHRISTMAS DAY- SCORE.":
    # Seven features: six vocal cues and one clarinet solo. Pages only, apart from the first bar.
    max_features: 7
    features:
      - {instrument: Vocal, kind: vocal, page: 1, bar: 4}
      - {instrument: Vocal, kind: vocal, page: 5}
      - {instrument: Vocal, kind: vocal, page: 6}
      - {instrument: Vocal, kind: vocal, page: 10}
      - {instrument: Vocal, kind: vocal, page: 12}
      - {instrument: Vocal, kind: vocal, page: 13}
      - {instrument: Clarinet, page: 16}
    not_features:
      - {instrument: Piano, page: 13}

  "I Pray on Christmas extended version nov Score":
    # Three features: a piano solo vamp, a tuba solo while the bass is tacet, and a tuba solo break.
    max_features: 3
    features:
      - {instrument: Piano, page: 1}
      - {instrument: Tuba, page: 3}
      - {instrument: Tuba, page: 8, bar: 46, mark: D, xfail: "reported once, as an open solo with no instrument: the marking is generic over every staff, so it is not given to a staff"}
    not_features:
      - {instrument: Alto Sax, page: 8}

  # A scan (OCR). Page-1 staves: Alto Sax 1-2, Tenor Sax 1-2, Baritone Sax, Trumpet 1-4,
  # Trombone 1-4, Guitar, Piano, Bass, Drums, Vibraphone. Staff names are not abbreviated on later pages.
  "SCORE- The Most Wonderful Time of the Year  copy":
    instruments:
      - {name: Alto Sax, chairs: [1, 2]}
      - {name: Tenor Sax, chairs: [1, 2]}
      - Baritone Sax
      - {name: Trumpet, chairs: [1, 2, 3, 4]}
      - {name: Trombone, chairs: [1, 2, 3, 4]}
      - Guitar
      - Piano
      - Bass
      - Drums
      - Vibraphone
    # No solo or feature markings in this score.
    max_features: 0

  # Page-1 staves: Vocals (two staves, Alto and Alto: vocal parts, not the sax), Flute, Trumpet in Bb,
  # Trombone, Guitar, Organ (unlabeled on later pages), Piano, Acoustic Bass ("A.B."), Drum Set.
  # The two "Alto" staves under the "Vocals" group are voice staves: the tool reports no Alto Sax or Lead Vocal
  # (the checker cannot assert an instrument is absent; the in-place run shows it).
  "What Child is This 2018 - SCORE":
    instruments:
      - Flute
      - Trumpet
      - Trombone
      - Guitar
      - Organ
      - Piano
      - Bass
      - Drums
    # One feature: an open solo with no instrument (p2, bar 45).
    max_features: 1
    features:
      - {open: true, page: 2, bar: 45}
