name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu: text-layer tests only; the macOS-only OCR tests skip themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uvx ruff check src --select F,E9  # undefined names, duplicate definitions
      - run: uv run pytest

  test-macos:
    # Apple Vision OCR tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
