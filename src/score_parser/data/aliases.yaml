# Instrument alias table. Entries of `aliases` are matched case-insensitively
# after stripping periods, transposition ("in Bb") and the chair range.
instruments:
  - name: Alto Sax
    family: Saxophone
    aliases: [alto saxophone, alto sax, alto sx, a sx, a sax, alto]
  - name: Tenor Sax
    family: Saxophone
    aliases: [tenor saxophone, tenor sax, tenor sx, t sx, t sax, tenor]
  - name: Baritone Sax
    family: Saxophone
    aliases: [baritone saxophone, baritone sax, bari sax, bari sx, b sx, bari]
  - name: Trumpet
    family: Trumpet
    aliases: [trumpet, trumpets, trpt, tpt, tpts, trp]
  - name: Trombone
    family: Trombone
    aliases: [trombone, trombones, tbn, tbns, tromb]
  - name: Bass Trombone
    family: Trombone
    aliases: [bass trombone, b tbn, bass tbn]
  - name: Piano
    family: Rhythm
    aliases: [piano, pno, pf]
  - name: Guitar
    family: Rhythm
    aliases: [guitar, gtr]
  - name: Bass
    family: Rhythm
    aliases: [bass, double bass, acoustic bass, bs]
  - name: Drums
    family: Rhythm
    aliases: [drums, drum set, drumset, dr, dm]
