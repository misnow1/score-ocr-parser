# Alternative titles for planner number slugs (from the planner glossary/spec).
# Editable data: add a slug and its other names; matching ignores case and "the".
aliases:
  first-noel: [First Nowell]
  do-you-hear: [Do You Hear What I Hear]
  please-come-home: [Please Come Home For Christmas]
  superstition: [Super Christmas, Merry Super Christmas]  # parodies of the same song

# Words a part file name may carry after (or around) a song's title and that
# name no instrument: they describe the file. A word after the title that is
# neither one of these, an instrument nor a number follows another song's title.
# A long word here also matches its close misspellings. Also here: a status
# word or an editor's initials some files carry, and the words of a synthesizer
# patch name that follows its part.
part_descriptions: [lyrics, only, sheet, lead, vocal, background, backing, singers, with, as, and, solo, copy, first, satb, not, jn, airy, bell, tone, light, attack, ethereal]

# Words dropped from a title, a score's or a part file's, before titles are
# compared: noise a filename carries. A title that needs one of these words to
# tell it from another song cannot be told apart by this tool.
title_noise: [extended, version, revised, expanded, instr, instrumentation, bkup, eprint, nov, dragged]
