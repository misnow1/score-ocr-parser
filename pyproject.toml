[project]
name = "score-ocr-parser"
version = "0.1.0"
description = "Extract instrumentation and solos from big-band score PDFs"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.scripts]
score-parser = "score_parser.cli:main"

[dependency-groups]
dev = [
    "fonttools>=4.68.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
